  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

dow-sm:0 1px 2px rgba(26,34,53,.06);\n    --shadow-md:0 10px 30px -10px rgba(26,34,53,.15), 0 2px 6px rgba(26,34,53,.05);\n    --shadow-lg:0 30px 70px -25px rgba(26,34,53,.28), 0 12px 24px -12px rgba(26,34,53,.12);\n    --shadow-gold:0 20px 50px -22px rgba(201,168,76,.55);\n    --ease:cubic-bezier(.2,.7,.2,1);\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{\n    font-family:'Inter', system-ui, -apple-system, sans-serif;\n    font-size:16px;line-height:1.55;color:var(--ink);background:var(--white);\n    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n  }\n  a{color:inherit;text-decoration:none}\n  button{font-family:inherit;cursor:pointer;border:none;background:none}\n  img{max-width:100%;display:block}\n  .container{width:100%;max-width:1200px;margin:0 auto;padding:0 24px}\n\n  /* Logo */\n  .logo-img{\n    height:44px;width:auto;display:block;\n    border-radius:8px;\n  }\n\n  /* Buttons */\n  .btn{\n    display:inline-flex;align-items:center;justify-content:center;gap:8px;\n    padding:13px 22px;border-radius:10px;\n    font-weight:600;font-size:15px;letter-spacing:-.01em;\n    transition:transform .15s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);\n    white-space:nowrap;\n  }\n  .btn:active{transform:translateY(1px)}\n  .btn-primary{\n    background:var(--gold);color:var(--navy);\n    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 12px 26px -12px rgba(201,168,76,.55);\n  }\n  .btn-primary:hover{background:var(--gold-2);box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 16px 32px -14px rgba(201,168,76,.7)}\n  .btn-navy{\n    background:var(--navy);color:white;\n    box-shadow:0 12px 26px -12px rgba(26,34,53,.6);\n  }\n  .btn-navy:hover{background:var(--navy-2)}\n  .btn-ghost{\n    background:white;color:var(--navy);border:1px solid var(--line);\n  }\n  .btn-ghost:hover{border-color:#cfd4e0;background:var(--bg-soft)}\n  .btn-outline-navy{\n    background:transparent;color:var(--navy);border:1px solid var(--navy);\n  }\n  .btn-outline-navy:hover{background:var(--navy);color:white}\n  .btn-outline-gold{\n    background:transparent;color:var(--gold);border:1px solid rgba(201,168,76,.5);\n  }\n  .btn-outline-gold:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}\n  .btn-lg{padding:16px 28px;font-size:16px}\n\n  /* Header */\n  .site-header{\n    position:sticky;top:0;z-index:50;\n    background:rgba(255,255,255,.88);\n    backdrop-filter:saturate(1.2) blur(12px);\n    -webkit-backdrop-filter:saturate(1.2) blur(12px);\n    border-bottom:1px solid rgba(26,34,53,.06);\n  }\n  .nav{display:flex;align-items:center;gap:24px;height:76px}\n  .brand{display:flex;align-items:center}\n  .brand .logo-img{height:40px}\n  .nav-links{display:flex;gap:28px;margin-left:28px}\n  .nav-links a{\n    font-size:14.5px;color:#444b5c;font-weight:500;padding:6px 0;position:relative;\n  }\n  .nav-links a:hover{color:var(--navy)}\n  .nav-links a::after{\n    content:\"\";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold);\n    transform:scaleX(0);transform-origin:left;transition:transform .2s var(--ease);\n  }\n  .nav-links a:hover::after{transform:scaleX(1)}\n  .nav-right{margin-left:auto;display:flex;align-items:center;gap:20px}\n  .login-link{font-size:14px;color:var(--muted);font-weight:500}\n  .login-link:hover{color:var(--navy)}\n  .login-link .arrow{display:inline-block;transition:transform .15s var(--ease)}\n  .login-link:hover .arrow{transform:translateX(3px)}\n  .menu-toggle{display:none;width:40px;height:40px;border-radius:8px;color:var(--navy)}\n  .menu-toggle svg{width:22px;height:22px}\n\n  /* Hero */\n  .hero{\n    position:relative;overflow:hidden;padding:92px 0 80px;\n    background:\n      radial-gradient(1100px 500px at 90% -10%, rgba(201,168,76,.10), transparent 60%),\n      radial-gradient(900px 440px at 5% 110%, rgba(26,34,53,.06), transparent 60%),\n      line );box-shadow:var(--shadow-gold), var(--shadow-lg);\n  }\n  .float-label{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-weight:700}\n  .float-title{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:6px;line-height:1.3}\n  .float-desc{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:6px;line-height:1.45}\n  .float-chev{\n    margin-top:12px;display:inline-flex;align-items:center;gap:6px;\n    font-size:12.5px;color:var(--gold);font-weight:600;\n  }\n\n  .panel-notify{\n    left:-20px;top:30px;padding:12px 16px 12px 12px;border-radius:12px;\n    display:flex;gap:12px;align-items:center;background:white;border:1px solid var(--line-2);\n  }\n  .panel-notify .ico{\n    width:34px;height:34px;border-radius:9px;background:var(--navy);\n    display:grid;place-items:center;color:var(--gold);\n  }\n  .panel-notify .txt{font-size:12px;color:var(--muted)}\n  .panel-notify .txt b{color:var(--navy);font-weight:700}\n\n  /* Social proof */\n  .social{padding:48px 0 56px;border-top:1px solid var(--line-2);background:white}\n  .social-label{\n    text-align:center;font-size:12.5px;color:var(--muted-2);font-weight:600;\n    letter-spacing:.18em;text-transform:uppercase;margin-bottom:32px;\n  }\n  .logos{display:grid;grid-template-columns:repeat(6,1fr);gap:20px 36px;align-items:center}\n  .logo-fake{\n    height:36px;display:flex;align-items:center;justify-content:center;gap:9px;\n    color:#8891a3;font-weight:700;font-size:16.5px;letter-spacing:-.01em;\n    filter:grayscale(1);opacity:.85;transition:opacity .2s var(--ease), filter .2s var(--ease);\n  }\n  .logo-fake:hover{opacity:1;filter:grayscale(.3)}\n  .logo-fake .lm{\n    width:24px;height:24px;border-radius:6px;display:grid;place-items:center;\n    color:white;font-size:12px;font-weight:800;\n  }\n\n  /* Section */\n  .section{padding:104px 0}\n  .section-head{text-align:center;max-width:700px;margin:0 auto 56px}\n  .section-kicker{\n    display:inline-block;font-size:12.5px;font-weight:700;color:#8a6f1f;\n    letter-spacing:.14em;text-transform:uppercase;\n    padding:6px 12px;border-radius:999px;background:rgba(201,168,76,.14);\n  }\n  .section-title{\n    font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.02em;\n    color:var(--navy);line-height:1.12;margin:16px 0 12px;text-wrap:balance;\n  }\n  .section-sub{color:var(--muted);font-size:17px;line-height:1.6;text-wrap:pretty}\n\n  /* Features */\n  .features{background:var(--bg-softer);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}\n  .feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}\n  .feat{\n    background:white;border-radius:16px;padding:30px;\n    border:1px solid var(--line);\n    transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);\n  }\n  .feat:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#cfd4e0}\n  .feat-ico{\n    width:52px;height:52px;border-radius:13px;\n    background:linear-gradient(180deg, var(--navy), var(--navy-dark));\n    display:grid;place-items:center;color:var(--gold);\n    box-shadow:inset 0 0 0 1px rgba(201,168,76,.3), 0 10px 22px -8px rgba(26,34,53,.35);\n  }\n  .feat-ico svg{width:24px;height:24px}\n  .feat h3{\n    font-size:18px;font-weight:700;color:var(--navy);\n    margin:20px 0 8px;letter-spacing:-.01em;\n  }\n  .feat p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0}\n\n  /* Mid CTA */\n  .mid-cta{padding:80px 0}\n  .mid-cta-box{\n    position:relative;overflow:hidden;\n    background:linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 55%, var(--navy-2) 100%);\n    border-radius:24px;padding:72px 56px;color:white;text-align:center;\n    box-shadow:var(--shadow-lg);\n    border:1px solid rgba(201,168,76,.15);\n  }\n  .mid-cta-box::before{\n    content:\"\";position:absolute;inset:0;pointer-events:none;\n    background:\n      radial-gradient(500px 260px at 82% 120%, rgba(201,168,76,.22), transparent 60%),\n      radial-gradient(420px 220px at 10% -20%, rgba(201,168,76,.10), transparent 60%);\n  }\n  .mid-cta-box::after{\n    content:\"\";position:absolute;left:50%;top:-1px;width:180px;height:2px;transform:translateX(-50%);\n    background:linear-gradient(90deg, transparent, var(--gold), transparent);\n  }\n  .mid-cta-inner{position:relative}\n  .mid-cta h2{\n    font-size:clamp(30px,3.6vw,40px);font-weight:800;letter-spacing:-.02em;\n    line-height:1.15;margin:0 0 14px;text-wrap:balance;\n  }\n  .mid-cta h2 .gold{color:var(--gold)}\n  .mid-cta p{\n    color:rgba(255,255,255,.72);font-size:17.5px;max-width:600px;margin:0 auto 30px;text-wrap:pretty;\n  }\n  .mid-cta-meta{\n    display:flex;gap:24px;justify-content:center;flex-wrap:wrap;\n    margin-top:24px;font-size:13.5px;color:rgba(255,255,255,.65);\n  }\n  .mid-cta-meta span{display:inline-flex;align-items:center;gap:6px}\n  .mid-cta-meta span::before{\n    content:\"\";width:6px;height:6px;border-radius:50%;background:var(--gold);\n  }\n\n  /* Pricing */\n  .pricing{background:white}\n  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}\n  .plan{\n    position:relative;background:white;border:1px solid var(--line);\n    border-radius:20px;padding:34px;display:flex;flex-direction:column;\n    transition:transform .2s var(--ease), box-shadow .2s var(--ease);\n  }\n  .plan:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}\n  .plan-name{\n    font-size:13px;font-weight:700;color:#8a6f1f;\n    text-transform:uppercase;letter-spacing:.14em;\n  }\n  .plan-price{margin-top:16px;display:flex;align-items:baseline;gap:6px}\n  .plan-price .currency{font-size:20px;color:var(--muted-2);font-weight:600}\n  .plan-price .amount{font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--navy);line-height:1}\n  .plan-price .period{font-size:15px;color:var(--muted-2)}\n  .plan-desc{color:var(--muted);font-size:14.5px;margin:14px 0 24px;line-height:1.55}\n  .plan-divider{border
